<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        /* loại 2: internal style */
        h2{
            /* color dùng để quy định màu chữ */
            color: pink; 
        }
        #tieuDe{
            color:brown;
        }
    </style>
    <!-- Kiểu 3: tạo file css xong liên kết link-->
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <!-- I. Các kiểu viết style -->
    <!-- Kiểu 1 viết style trong thẻ -->
    <!-- Loại 1: Inline style viết trực tiếp trong thẻ  -->
    <h1 style="color: blue">HUMG</h1>
    <!-- Kiểu 2 viết ngoài thẻ <body> -->
    <h2>Trường Đại học Mỏ - Địa chất</h2>
    <h3>Lớp phát triển ứng dụng web 03</h3>
    <!-- II. Selector -->
    <!-- Cách 1: dùng tên thẻ -->
    <!-- Cách 2: dùng id (Viết dấu # trước tên id) -->
    <h2 id="tieuDe">Trường Đại học Mỏ - Địa chất</h2>
    <!-- Cách 3: dùng class (viết dấu . trước tên class) -->
    <h2 id="tieuDe" class="tieuDe">Trường Đại học Mỏ - Địa chất</h2>
    <!-- Cách 3: dùng element.class (ví dụ: h3.tieuDe2)-->
    <h3 class="tieuDe2">Lớp phát triển ứng dụng web 03</h3>
</body>
</html>
