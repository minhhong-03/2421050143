<html>
    <head>
        <title>bai 1 html</title>

    </head>
    <body>
        Môn phát triển ứng dụng web + BTL

        <!-- để chú thích dùng 2 cách

        cách 1: ctrl + k +c 
        cách 2: ctrl + /
        -->

        <!-- Thẻ p để phân đoạn có khoảng trống ở giữa  -->
        <p> Thẻ P là thẻ phân đoạn</p>

        <!-- Thẻ h là thẻ định dạng đề mục, mục nào chính dùng h1 -->
        <h1> Thẻ H1</h1>
        <h2> Thẻ H2</h2>
        <h3> Thẻ H3</h3>

        <p>Môn web <br> Nhóm 03
        <!-- Thẻ br để xuống dòng -->

        <!-- Thẻ div và span để phân chia đoạn -->
         <div> Đây là thẻ div</div>
         <span> Đây là thẻ span</span>
         <br>

          <!-- Thẻ b dùng để viết đậm 
          Thẻ i: dùng để viết nghiêng 
          Thẻ u: dùng để gạch chân  -->
         <i> Đây là thẻ i</i> <br>
         <b> Đây là thẻ b</b> <br>
         <u>Đây là thẻ u</u> <br>

        <div>
            <font face ="verdana">Môn Phát Triển Ứng Dụng Web</font>
            <font color="blue">Nhóm 03</font>
            <font size="10">Tiết 1 2 </font>
        <br>
            <font face="Arial", color="green", size="15">Lê Thị Minh Hồng</font>
           
        </div>

    </body>

</html>
