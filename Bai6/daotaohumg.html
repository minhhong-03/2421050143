<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo</title>
    <style>
        body{
            margin: 0;
        }
        .danh-sach-muc{
            padding: 0;
            margin: 0;
            /* bỏ dấu chấm ở danh sách khi dùng ul, il dùng list_style */
            list-style: none;
            display: flex;
            /* gap khoảng cách các đối tượng ở trong  */
            gap: 20px;
        }
        .danh-muc{
            background-color: #198cf0;
            padding: 10px;
        }
        .lien-ket{
            color: white;
            /* bỏ gạch chân dùng text-decoration */
            text-decoration: none;
        }
        .muc{
        
        }
        main{
            display: flex;
        }
        .trai{
            width: 20%;
            height: 100vh;
            /* tạo đường viền dùng boder */
            /* 3 tham số: độ dày, loại đường viền, mầu sắc */
            border-right: 1px solid #198cf0;
        }
        .khoi-dang-nhap{
            width: 100%;
            height: 100px;

        }
        form{
          
            width: 80%;
            margin: 10px auto;
        }
        .khoi-thong-tin{
            width: 100%;
            margin-bottom: 10px;
        }
        p{
            margin: 0;
        }
        input{
            width: 100%;
            padding: 5px 0;
            /* bo tròn dùng border-radius */
            border-radius: 5px;
        }
        .quen-mat-khau{
           display: flex;
           justify-content: flex-end;
        }
        .quen-mat-khau-lien-ket{
            color: #198cf0;
            text-decoration: none; 
        }    
        button{
            width: 100%;
            padding: 5px 0;
        }
        .login{
            margin-bottom: 10px;
        }
    
        .phai{
            width: 80%;
        
        }
        .tin{
            width: 95%;
            height: 100px;
            margin: 20px auto;
            border: 1px solid #198cf0;
            border-radius: 10px;
        }
        .chuc-nang{
            width: 95%;
            height: 30px;
            display: flex;
            margin: 5px auto;
            padding: 5px;
            justify-content: space-between;
            border-bottom: 1px solid #198cf0;

        }
        .xem-tiep{
            color: #198cf0;
            text-decoration: none;
        }
        .lien-ket-xem-tiep{
            
        }
    </style>
</head>
<body>
    <!--- Danh mục ---> 
    <nav class="danh-muc">
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#" class="lien-ket">Thực tập, Đồ án</a></li>
            <li class="muc"><a href="#" class="lien-ket">Thủ tục Một cửa</a></li>
            <li class="muc"><a href="#" class="lien-ket">Một cửa online</a></li>
            <li class="muc"><a href="#" class="lien-ket">Email HUMG</a></li>
        </ul>

    </nav>
    <main>
        <div class="trai">
            <div class="khoi-dang-nhap"></div>
                <form action="">
                    <div class="khoi-thong-tin">
                        <p>Tài khoản</p>
                        <input type="text" name="" id="">
                    </div>
                    <div class="khoi-thong-tin">
                        <p>Mật khẩu</p>
                        <input type="password" name="" id="">
                    </div>
                     <div class="quen-mat-khau">
                        <a class="quen-mat-khau-lien-ket " href="">Quên mật khẩu</a>
                    </div>
                    <div class="khoi-thong-tin">
                        <button class="login">Đăng nhập</button>
                        <button class="login-365">Đăng nhập với Microsoft Office</button>
                    </div>
                </form>
        </div>
        <div class="phai">
            <div class="danh-sach-tin">
                <div class="tin">
                    <div class="chuc-nang">
                        <div class="tieu-de"> Tin tức</div>
                        <div class="xem-tiep"><a class="lien-ket-xem-tiep" href="">Xem tiếp</a></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
