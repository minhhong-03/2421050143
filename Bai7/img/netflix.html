<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #2F2C38;
            Color: white;

        }
        .danh-sach-muc {
            /* cho lên cùng 1 dòng dùng display: flex  */
            display: flex;
            padding: 0;
            margin: 0;
            /* bỏ dấu chấm ở danh sách khi dùng ul, il dùng list_style */
            list-style: none;
            display: flex;
            /* gap khoảng cách các đối tượng ở trong  */
            gap: 20px;
        }   
        .danh-muc{
            /* background-color: black; */
            color: white;
        } 
        .lien-ket-muc {
            color: #DBDBDD;
            /* bỏ gạch chân dùng text-decoration */
            text-decoration: none;
        }
        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .muc{
            padding: 15px;
            border-radius: 25px;

        }
        .muc : :hover{
            background-color: gray;
        }
        .logo{

        }
        .avata{
            width: 50px;
        }
        .dang-chon{
            background-color: #4E4B52;
        }
        .banner{
            background-color: white;
            width: 95%;
            /* height: 40vh; */
            margin: 20px auto;
            border-radius: 20px;

        }
        .banner-anh{
            width: 100%;
            border-radius: 20px;
        }
        .danh-sach-the-loai{
            width: 95%;
            /* height: 20vh; */
            margin: 20px auto;

        }
        .phim{
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .phim-poster{
            width: 24%;
            height: 15vh;
            border-radius: 15px;
            background-color: aliceblue ;
        }
        .danh-sach-nhan-vat{
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .danh-sach-nhan-vat .phim{
            gap: 10px;
            display: flex;
            justify-content: space-between;
           
        }
        .nhan-vat{
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .hai-huoc{
            width: 24%;
            height: 15vh;
            border-radius: 15px;
            background-color: aliceblue ;
        }    
        .hoat-hinh{
            width: 24%;
            height: 15vh;
            border-radius: 15px;
            background-color: aliceblue ;
        }

    </style>
</head>
<body>
    <header>
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
               <img class="logo" src="logo.png" alt="">
               <li class="muc dang-chon"><a href="#" class="lien-ket-muc">Trang chủ</a></li>
               <li class="muc"><a href="#" class="lien-ket-muc">Nhân vật</a></li>
               <li class="muc"><a href="#" class="lien-ket-muc">Series</a></li>
               <li class="muc"><a href="#" class="lien-ket-muc">Phim</a></li>
               <li class="muc"><a href="#" class="lien-ket-muc">Mới & Phổ biến</a></li>
               <li class="muc"><a href="#" class="lien-ket-muc">Netflix của tôi</a></li>
               <li class="muc"><a href="#" class="lien-ket-muc">Duyệt tìm theo ngôn ngôn</a></li>
            </ul>
        </nav>
        <div class="chuc-nang">
            <div class="tim-kiem"></div>
            <div class="thong-tin">
                <img class="avata" src="avata.jpg" alt="">
            </div>
        </div>

    </header>
    <main>
        <div class="banner">
            <img class="banner-anh" src="banner.jpg" alt="">
        </div>
        <div class="danh-sach-the-loai">
            <div class="the-loai">
                <div class="ten-the-loai"> 
                    <h2>Có thể bạn chưa xem</h2></div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="anh28.jpg" class="phim-poster"></img>
                        <img src="anh12.jpg" class="phim-poster"></img>
                        <img src="anh9.jpg" class="phim-poster"></img>
                        <img src="anh10.jpg" class="phim-poster"></img>
                        <img src="anh11.jpg" class="phim-poster"></img>                        
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai"> 
                    <h2>Phim hài hước</h2></div>
                <div class="danh-sach-phim-hai-huoc">
                    <div class="phim">
                        <img src="anh29.jpg" class="hai-huoc"></img>
                        <img src="anh5.jpg" class="hai-huoc"></img>
                        <img src="anh6.jpg" class="hai-huoc"></img>
                        <img src="anh7.jpg" class="hai-huoc"></img>
                        <img src="anh8.jpg" class="hai-huoc"></img>                        
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai"> 
                    <h2>Hoạt hình</h2></div>
                <div class="danh-sach-phim-hoat-hinh">
                    <div class="phim">
                        <img src="anh1.jpg" class="hoat-hinh"></img>
                        <img src="anh2.jpg" class="hoat-hinh"></img>
                        <img src="anh3.jpg" class="hoat-hinh"></img>
                        <img src="anh4.jpg" class="hoat-hinh"></img>   
                        <img src="anh30.jpg" class="hoat-hinh"></img>                     
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai"> 
                    <h2>Mọi người đang xem</h2></div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="anh13.jpg" class="hoat-hinh"></img>
                        <img src="anh14.jpg" class="hoat-hinh"></img>
                        <img src="anh15.jpg" class="hoat-hinh"></img>
                        <img src="anh16.jpg" class="hoat-hinh"></img>    
                        <img src="anh31.jpg" class="hoat-hinh"></img>                      
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai"> 
                    <h2>Top 10 phim Trẻ em tại Việt Nam hôm nay</h2></div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <img src="anh17.jpg" class="hoat-hinh"></img>
                        <img src="anh18.jpg" class="hoat-hinh"></img>
                        <img src="anh19.jpg" class="hoat-hinh"></img>
                        <img src="anh20.jpg" class="hoat-hinh"></img>     
                        <img src="anh32.jpg" class="hoat-hinh"></img>                      
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai"> 
                    <h2>Nhân vật</h2></div>
                <div class="danh-sach-nhan-vat"> 
                    <div class="phim">
                        <img src=anh21.jpg class="nhan-vat"></img>
                        <img src=anh22.jpg class="nhan-vat"></img>
                        <img src=anh23.jpg class="nhan-vat"></img>
                        <img src=anh24.jpg class="nhan-vat"></img>        
                        <img src=anh25.jpg class="nhan-vat"></img>
                        <img src=anh26.jpg class="nhan-vat"></img>
                        <img src=anh27.jpg class="nhan-vat"></img>                  
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    
</body>
</html>
